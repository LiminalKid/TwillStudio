# Builds the handheld version and runs the tests on every push to main; on a version tag (v0.2.0)
# it also publishes a GitHub release with the handheld packages, its notes taken from
# the tag's message.
#
# It runs on GitHub's AArch64 Linux machines, so the tests run natively, as they would on a handheld.
# The build is the same as tools/make-knulli-sysroot.sh plus the knulli preset, except that the SDL2
# library linked against is Ubuntu's rather than one copied from a KNULLI device: the binary only
# needs libSDL2-2.0.so.0 at run time, and uses the device's own.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.1
  ZIG_SHA256: a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795  # zig-aarch64-linux-0.17.1.tar.xz
  SDL_VERSION: 2.32.8  # the headers match what KNULLI ships

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build zip libsdl2-2.0-0

      - name: Zig
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-aarch64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          tar xf zig.tar.xz
          echo "ZIG=$RUNNER_TEMP/zig-aarch64-linux-$ZIG_VERSION/zig" >> "$GITHUB_ENV"

      - name: Sysroot (SDL2)
        run: |
          S="$RUNNER_TEMP/sysroot"
          mkdir -p "$S/usr/lib" "$S/usr/include/SDL2"
          cp -L /usr/lib/aarch64-linux-gnu/libSDL2-2.0.so.0 "$S/usr/lib/"
          ln -s libSDL2-2.0.so.0 "$S/usr/lib/libSDL2.so"
          curl -sSfL "https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL2-$SDL_VERSION.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/SDL2-$SDL_VERSION"/include/*.h "$S/usr/include/SDL2/"
          echo "TWILL_SYSROOT=$S" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake --preset knulli
          cmake --build --preset knulli

      - name: Tests
        run: build/knulli/twill_tests

      - name: Handheld packages
        run: |
          tools/make-knulli-zip.sh
          tools/make-muos-app.sh
          tools/make-portmaster-zip.sh
          tools/make-nextui-pak.sh
          tools/make-trimui-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: twill-knulli
          path: build/knulli-zip/TwillStudio-KNULLI.zip

      - uses: actions/upload-artifact@v4
        with:
          name: twill-muos
          path: build/muos/TwillStudio-muOS.muxapp

      - uses: actions/upload-artifact@v4
        with:
          name: twill-portmaster
          path: build/portmaster/twill.zip

      - uses: actions/upload-artifact@v4
        with:
          name: twill-nextui
          path: build/nextui/TwillStudio.pak.zip

      - uses: actions/upload-artifact@v4
        with:
          name: twill-trimui
          path: build/trimui/TwillStudio-TrimUI.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the version
        run: |
          v=$(sed -n 's/^project(TwillStudio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, but CMakeLists.txt says $v"; exit 1; }
          # The Pak Store reads pak.json from main and fetches the release tagged with its version.
          grep -q "\"version\": \"$GITHUB_REF_NAME\"" pak.json || { echo "pak.json's version isn't $GITHUB_REF_NAME"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: twill-knulli

      - uses: actions/download-artifact@v4
        with:
          name: twill-muos

      - uses: actions/download-artifact@v4
        with:
          name: twill-portmaster

      - uses: actions/download-artifact@v4
        with:
          name: twill-nextui

      - uses: actions/download-artifact@v4
        with:
          name: twill-trimui

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the tag's message. The checkout above fetches the tagged commit without the tag
        # itself, so fetch the tag. TwillStudio-KNULLI.zip is for KNULLI's Ports without PortMaster;
        # TwillStudio-muOS.muxapp is for muOS's Archive Manager;
        # twill.zip is the name PortMaster installs it under;
        # TwillStudio.pak.zip is pak.json's release_filename, which the Pak Store downloads;
        # TwillStudio-TrimUI.zip is for the TrimUI Brick's and Smart Pro's own menu.
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          test -s notes.md || { echo "The tag has no message: use git tag -a"; exit 1; }
          gh release create "$GITHUB_REF_NAME" TwillStudio-KNULLI.zip TwillStudio-muOS.muxapp twill.zip TwillStudio.pak.zip TwillStudio-TrimUI.zip \
            --title "Twill Studio ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

  # On a version tag, also updates the itch.io page (liminalkid.itch.io/twill-studio) with butler,
  # itch.io's uploader: the web version, played in the page, and the handheld packages, each on
  # its own channel so a new push replaces the last one. Needs the repository secret BUTLER_API_KEY
  # (an itch.io API key); without it the job does nothing. Running this workflow by hand (Actions >
  # Build > Run workflow) on main uploads main's build under CMakeLists.txt's version.
  itch:
    if: >-
      always() && needs.build.result == 'success' && needs.release.result != 'failure' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: [build, release]
    runs-on: ubuntu-24.04
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      EMSCRIPTEN_VERSION: 7.0.0  # as in pages.yml
      ITCH_GAME: liminalkid/twill-studio
    steps:
      - uses: actions/checkout@v4
        if: env.BUTLER_API_KEY != ''

      - name: Emscripten
        if: env.BUTLER_API_KEY != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build zip
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          ./emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk activate "$EMSCRIPTEN_VERSION"

      - name: Web version for itch.io
        if: env.BUTLER_API_KEY != ''
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build/web -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/web --target twill
          tools/make-itch.sh

      - uses: actions/download-artifact@v4
        if: env.BUTLER_API_KEY != ''
        with:
          name: twill-knulli

      - uses: actions/download-artifact@v4
        if: env.BUTLER_API_KEY != ''
        with:
          name: twill-muos

      - uses: actions/download-artifact@v4
        if: env.BUTLER_API_KEY != ''
        with:
          name: twill-portmaster

      - uses: actions/download-artifact@v4
        if: env.BUTLER_API_KEY != ''
        with:
          name: twill-nextui

      - uses: actions/download-artifact@v4
        if: env.BUTLER_API_KEY != ''
        with:
          name: twill-trimui

      - name: Push to itch.io
        if: env.BUTLER_API_KEY != ''
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$RUNNER_TEMP/butler" && chmod +x "$RUNNER_TEMP/butler/butler"
          B="$RUNNER_TEMP/butler/butler"
          V=$(sed -n 's/^project(TwillStudio VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          "$B" push build/twill-web-itch.zip "$ITCH_GAME:web" --userversion "$V"
          "$B" push TwillStudio-KNULLI.zip "$ITCH_GAME:knulli" --userversion "$V"
          "$B" push TwillStudio-muOS.muxapp "$ITCH_GAME:muos" --userversion "$V"
          "$B" push twill.zip "$ITCH_GAME:portmaster" --userversion "$V"
          "$B" push TwillStudio.pak.zip "$ITCH_GAME:nextui-pak" --userversion "$V"
          "$B" push TwillStudio-TrimUI.zip "$ITCH_GAME:trimui-stock" --userversion "$V"
